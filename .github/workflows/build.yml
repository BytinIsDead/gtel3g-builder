name: Build gtel3g (Lineage 16.0)

on:
  push:
    branches: [main]
    paths:
      - "manifests/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      variant:
        description: "Lunch variant"
        required: true
        default: "userdebug"
        type: choice
        options: [user, userdebug, eng]
      upload:
        description: "Upload artifacts"
        required: true
        default: true
        type: boolean

concurrency:
  group: gtel3g-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: /tmp/ccache
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_MAXSIZE: 20G

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder
          fetch-depth: 1

      - name: Free disk space
        run: |
          echo "Before:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          sudo docker system prune -af || true
          echo "After:"
          df -h

      - name: Install build deps
        run: |
          sudo apt-get update
          # Java 8 for Lineage 16.0 (Android 9) + generic AOSP deps
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z-dev \
            libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip openjdk-8-jdk git-lfs
          java -version
          ccache -V || true
          git lfs --version || true

      - name: Set up repo tool
        run: |
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          ~/.bin/repo --version || repo --version || true

      - name: Configure git
        run: |
          git config --global user.name "BytinIsDead"
          git config --global user.email "158576313+BytinIsDead@users.noreply.github.com"
          git config --global color.ui false

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-gtel3g-${{ github.run_id }}
          restore-keys: |
            ccache-gtel3g-

      - name: Repo init + sync
        run: |
          set -euo pipefail
          mkdir -p lineage-16.0/.repo/local_manifests
          cd lineage-16.0
          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --git-lfs --depth=1 || repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --git-lfs
          cp -v $GITHUB_WORKSPACE/builder/manifests/gtel3g.xml .repo/local_manifests/gtel3g.xml
          cat .repo/local_manifests/gtel3g.xml
          echo "=== repo sync (this takes ~30-60 min) ==="
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch 2>&1 | tee repo-sync.log
          # fail if repo sync failed (pipefail ensures tee doesn't mask)
          echo "=== repo manifest ==="
          cat .repo/manifest.xml | head -n 100 || true
          echo "=== local_manifests ==="
          ls -R .repo/local_manifests/ || true
          test -f build/envsetup.sh || { echo "ERROR: build/envsetup.sh missing — repo sync incomplete"; cat repo-sync.log; exit 1; }

      - name: Setup ccache
        working-directory: lineage-16.0
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR=/tmp/ccache
          ccache -M 20G || true
          ccache -z || true
          ccache -s || true

      - name: Build (lunch + mka bacon)
        working-directory: lineage-16.0
        run: |
          set -euo pipefail
          export USE_CCACHE=1
          export CCACHE_DIR=/tmp/ccache
          export CCACHE_EXEC=/usr/bin/ccache
          # Lineage 16.0 needs Java 8
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          java -version

          source build/envsetup.sh
          VARIANT="${{ inputs.variant || 'userdebug' }}"
          echo "Lunch: lineage_gtel3g-$VARIANT"
          lunch lineage_gtel3g-$VARIANT

          # Show device trees
          ls -l device/samsung/gtel3g/ || true
          ls -l kernel/samsung/gtel3g/ | head -n 20 || true

          mka bacon -j$(nproc --all) 2>&1 | tee build.log
          ccache -s || true
          ls -lh out/target/product/gtel3g/ || true

      - name: Show ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload build artifacts
        if: always() && (inputs.upload == null || inputs.upload == true)
        uses: actions/upload-artifact@v4
        with:
          name: gtel3g-lineage-16.0-${{ github.run_number }}
          path: |
            lineage-16.0/out/target/product/gtel3g/*.zip
            lineage-16.0/out/target/product/gtel3g/*.zip.md5sum
            lineage-16.0/out/target/product/gtel3g/recovery.img
            lineage-16.0/build.log
            lineage-16.0/repo-sync.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Create Release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.upload == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: gtel3g build ${{ github.run_number }}
          body: |
            Automated build from `${{ github.sha }}`

            - Device: `BytinIsDead/android_device_samsung_gtel3g@lineage-16.0`
            - Kernel: `BytinIsDead/android_kernel_samsung_gtel3g@main`
            - Manifest: `manifests/gtel3g.xml`
          files: |
            lineage-16.0/out/target/product/gtel3g/*.zip
            lineage-16.0/out/target/product/gtel3g/*.zip.md5sum
          fail_on_unmatched_files: false
          generate_release_notes: false
