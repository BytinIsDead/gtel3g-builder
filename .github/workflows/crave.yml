name: Crave gtel3g (Lineage 16.0)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: true
        default: "userdebug"
        type: choice
        options: [user, userdebug, eng]
      clean:
        description: "Clean build (--clean)"
        required: true
        default: "no"
        type: choice
        options: ["yes", "no"]
      paid:
        description: "Use paid queue (aosp-silver) — requires wallet"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "manifests/**"
      - ".github/workflows/crave.yml"
      - "configs/crave/**"

permissions:
  contents: write

concurrency:
  group: crave-gtel3g-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crave-build:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    env:
      PROJECTID: "81"
      PROJECTFOLDER: "/crave-devspaces/Lineage16"
      REPO_INIT: "repo init -u https://github.com/accupara/los16.git -b lineage-16.0 --git-lfs --depth=1"

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Crave credentials
        run: |
          if [[ -z "${{ secrets.CRAVE_USERNAME }}" || -z "${{ secrets.CRAVE_TOKEN }}" ]]; then
            echo "::error::Set CRAVE_USERNAME and CRAVE_TOKEN in repo Secrets (from foss.crave.io -> API Keys -> crave.conf)"
            exit 1
          fi
          if [[ "${{ secrets.CRAVE_USERNAME }}" == FILL_ME_IN* || "${{ secrets.CRAVE_TOKEN }}" == FILL_ME_IN* ]]; then
            echo "::error::CRAVE secrets still contain placeholder FILL_ME_IN — update them in Settings -> Secrets -> Actions"
            echo "See README Crave section or run: gh secret set CRAVE_USERNAME --repo ${{ github.repository }} --body \"your@email\" && gh secret set CRAVE_TOKEN --repo ${{ github.repository }} --body \"your_token\""
            exit 1
          fi
          echo "Crave creds present (username: ${{ secrets.CRAVE_USERNAME }})"

      - name: Install crave
        run: |
          mkdir -p ~/.bin
          curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          mv ./crave ~/.bin/crave
          chmod +x ~/.bin/crave
          sudo ln -sf $HOME/.bin/crave /usr/bin/crave
          crave --version || true
          # create crave.conf from sample (crave expects ~/crave.conf or ~/.crave.conf)
          if [ -f crave.conf.sample ]; then
            envsubst < crave.conf.sample > /tmp/crave.conf
            mkdir -p $HOME
            cp -v /tmp/crave.conf $HOME/crave.conf
            cp -v /tmp/crave.conf $HOME/.crave.conf
            cat $HOME/.crave.conf | sed 's/token = .*/token = ***/' || true
            crave --version 2>&1 | head || true
          else
            echo "::warning::crave.conf.sample not found"
          fi
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Create / ensure Crave clone
        run: |
          set -e
          # If running inside devspace, skip clone creation
          if [[ "$DCDEVSPACE" == *1* ]]; then
            echo "Already inside crave devspace — skipping clone create"
          else
            # Ensure jq present for clone list check
            sudo apt-get update && sudo apt-get install -y jq || true
            if crave clone list --json 2>&1 | jq -e --arg f "$PROJECTFOLDER" '.clones[] | select(.["Cloned At"] == $f)' >/dev/null 2>&1; then
              echo "Clone $PROJECTFOLDER already exists"
            else
              echo "Creating clone $PROJECTFOLDER projectID $PROJECTID"
              crave clone create --projectID "$PROJECTID" "$PROJECTFOLDER" || { echo "::warning::clone create failed — may already exist or need manual creation"; crave clone list || true; }
            fi
            echo "=== crave clone list ==="
            crave clone list || true
            crave clone list --json | jq . || true
          fi

      - name: Configure crave.yaml (after clone exists)
        run: |
          # Prefer custom yaml from secret, else template
          if [[ -n "${{ secrets.CUSTOM_YAML }}" ]]; then
            echo "${{ secrets.CUSTOM_YAML }}" > /tmp/crave.yaml
            echo "Using CUSTOM_YAML secret"
            cat /tmp/crave.yaml
          else
            cp configs/crave/crave.yaml.aosp /tmp/crave.yaml
            echo "Using configs/crave/crave.yaml.aosp"
            cat /tmp/crave.yaml
          fi
          # Place where crave expects it (project's .repo/manifests)
          sudo mkdir -p $PROJECTFOLDER/.repo/manifests 2>/dev/null || mkdir -p $PROJECTFOLDER/.repo/manifests || true
          sudo cp /tmp/crave.yaml $PROJECTFOLDER/.repo/manifests/crave.yaml 2>/dev/null || cp /tmp/crave.yaml $PROJECTFOLDER/.repo/manifests/crave.yaml || true
          ls -l $PROJECTFOLDER/.repo/manifests/ || true
          cat $PROJECTFOLDER/.repo/manifests/crave.yaml || true

      - name: Build via crave run (gtel3g)
        run: |
          set -e
          # Extra init for non-Lineage ROMs if needed (not for gtel3g)
          LOCAL_MANIFEST="mkdir -p .repo/local_manifests && rm -rf .repo/local_manifests/* || true && curl -L https://raw.githubusercontent.com/BytinIsDead/gtel3g-builder/main/manifests/gtel3g.xml -o .repo/local_manifests/gtel3g.xml && cat .repo/local_manifests/gtel3g.xml"
          LUNCH="lunch lineage_gtel3g-${{ inputs.variant || 'userdebug' }}"
          BUILD_CMD="mka bacon -j\$(nproc --all)"

          # Paid / clean flags
          CLEAN=""
          if [[ "${{ inputs.clean }}" == "yes" ]]; then CLEAN="--clean"; fi
          PAID=""
          if [[ "${{ inputs.paid }}" == "true" || -n "${{ secrets.PAID }}" ]]; then
            echo "Paid queue enabled (aosp-silver)"
            PAID="--platform aosp-silver"
          fi

          echo "=== Queuing crave run ==="
          echo "PROJECTID=$PROJECTID $PROJECTFOLDER"
          echo "REPO_INIT=$REPO_INIT"
          echo "LOCAL_MANIFEST=$LOCAL_MANIFEST"
          echo "LUNCH=$LUNCH"
          echo "BUILD_CMD=$BUILD_CMD"
          echo "PWD before: $(pwd)"
          echo "crave clone list:"
          crave clone list || true

          # IMPORTANT: must run from inside the project folder so crave finds the project
          cd "$PROJECTFOLDER"
          echo "PWD now: $(pwd)"
          ls -la || true

          crave ${{ secrets.CRAVE_FLAGS }} run --no-patch $CLEAN $PAID -- "
            set -e
            echo \"=== inside crave devspace PWD=\$(pwd) ===\"
            # Ensure local manifests override
            rm -rf .repo/local_manifests/*.xml || true
            $LOCAL_MANIFEST

            # Resync (crave ships /opt/crave/resync.sh or /usr/bin/resync)
            if [ -f /opt/crave/resync.sh ]; then
              /opt/crave/resync.sh
            elif [ -f /usr/bin/resync ]; then
              /usr/bin/resync
            else
              repo sync -c -j\$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch
            fi

            export BUILD_USERNAME=${{ github.actor }}
            export BUILD_HOSTNAME=crave
            source build/envsetup.sh
            $LUNCH
            make installclean || true
            $BUILD_CMD
          "
          echo "=== crave run finished ==="

      - name: Pull artifacts from crave
        if: always()
        run: |
          set +e
          cd "$PROJECTFOLDER" || cd /crave-devspaces/Lineage16 || true
          echo "Pulling out/error.log if any from $PROJECTFOLDER"
          crave pull out/error.log 2>&1 | head -n 200 || true
          if [ -f out/error.log ]; then echo "=== out/error.log ==="; cat out/error.log | head -n 500; fi
          if [ -f "$PROJECTFOLDER/out/error.log" ]; then echo "=== $PROJECTFOLDER/out/error.log ==="; cat "$PROJECTFOLDER/out/error.log" | head -n 500; fi

          echo "=== listing via crave ssh ==="
          crave ssh -- "ls -lh out/target/product/gtel3g/ || true; du -sh out/target/product/gtel3g/* 2>/dev/null | head -n 20 || true" || true

          # Try crave push + upload.sh path (exists on newer crave images)
          echo "${{ secrets.GITHUB_TOKEN }}" > /tmp/token.txt
          crave push /tmp/token.txt -d $(crave ssh -- pwd 2>/dev/null | grep -v Select | tr -d '\r' | head -n1)/ 2>&1 || echo "crave push not available, skipping"

          # Fallback: direct pull of zip via crave pull
          mkdir -p $GITHUB_WORKSPACE/pulled
          cd $GITHUB_WORKSPACE
          for f in out/target/product/gtel3g/*.zip out/target/product/gtel3g/*.zip.md5sum out/target/product/gtel3g/recovery.img; do
            crave pull "$PROJECTFOLDER/$f" 2>&1 | head -n 20 || crave pull "$f" 2>&1 | head -n 20 || true
            if [ -f "$(basename $f)" ]; then mv "$(basename $f)" pulled/ 2>/dev/null || true; fi
          done
          # also try pulling from absolute path
          ls -lh pulled/ || true
          ls -lh $PROJECTFOLDER/out/target/product/gtel3g/ 2>/dev/null || true
          # Try official upload script if present on devspace
          crave ssh -- "if [ -f /opt/crave/github-actions/upload.sh ]; then export GH_UPLOAD_LIMIT=\"${{ secrets.GH_UPLOAD_LIMIT }}\"; bash /opt/crave/github-actions/upload.sh '${{ github.run_id }}' 'gtel3g' '${{ github.repository }}' 'lineage_gtel3g-${{ github.run_id }}' '' || true; fi" || true

      - name: Upload artifacts to GitHub (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtel3g-crave-${{ github.run_number }}
          path: |
            pulled/*
            out/error.log
            out/target/product/gtel3g/*.zip
            out/target/product/gtel3g/*.zip.md5sum
          if-no-files-found: warn
          retention-days: 14

      - name: Release
        if: always() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crave-${{ github.run_number }}
          name: gtel3g crave build ${{ github.run_number }}
          body: |
            Crave build `${{ github.run_number }}` — Lineage 16.0 `gtel3g`

            - Device: `BytinIsDead/android_device_samsung_gtel3g@lineage-16.0`
            - Kernel: `BytinIsDead/android_kernel_samsung_gtel3g@main`
            - Base: `Lineage16` (accupara/los16, projectID 81)
            - Manifest: `manifests/gtel3g.xml`
            - Variant: `${{ inputs.variant }}` clean: `${{ inputs.clean }}`
          files: |
            pulled/*.zip
            pulled/*.zip.md5sum
            out/target/product/gtel3g/*.zip
          fail_on_unmatched_files: false

      - name: Destroy clone (optional)
        if: always()
        run: |
          # Keep clone for ccache reuse; only destroy if you want clean next time
          echo "Clone kept at $PROJECTFOLDER for next build (reuse ccache). Destroy manually with: crave clone destroy -y $PROJECTFOLDER"
          # Uncomment to auto-destroy:
          # crave clone destroy -y "$PROJECTFOLDER" || true
