name: Crave gtel3g (Lineage 16.0)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: true
        default: "userdebug"
        type: choice
        options: [user, userdebug, eng]
      clean:
        description: "Clean build (--clean)"
        required: true
        default: "no"
        type: choice
        options: ["yes", "no"]
      paid:
        description: "Use paid queue (aosp-silver) — requires wallet"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "manifests/**"
      - ".github/workflows/crave.yml"
      - "configs/crave/**"

permissions:
  contents: write

concurrency:
  group: crave-gtel3g-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crave-build:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    env:
      PROJECTID: "81"
      PROJECTFOLDER: "/crave-devspaces/Lineage16"
      REPO_INIT: "repo init -u https://github.com/accupara/los16.git -b lineage-16.0 --git-lfs --depth=1"

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Crave credentials
        run: |
          if [[ -z "${{ secrets.CRAVE_USERNAME }}" || -z "${{ secrets.CRAVE_TOKEN }}" ]]; then
            echo "::error::Set CRAVE_USERNAME and CRAVE_TOKEN in repo Secrets (from foss.crave.io -> API Keys -> crave.conf)"
            exit 1
          fi
          if [[ "${{ secrets.CRAVE_USERNAME }}" == FILL_ME_IN* || "${{ secrets.CRAVE_TOKEN }}" == FILL_ME_IN* ]]; then
            echo "::error::CRAVE secrets still contain placeholder FILL_ME_IN — update them in Settings -> Secrets -> Actions"
            echo "See README Crave section or run: gh secret set CRAVE_USERNAME --repo ${{ github.repository }} --body \"your@email\" && gh secret set CRAVE_TOKEN --repo ${{ github.repository }} --body \"your_token\""
            exit 1
          fi
          echo "Crave creds present (username: ${{ secrets.CRAVE_USERNAME }})"

      - name: Install crave
        run: |
          mkdir -p ~/.bin
          curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          mv ./crave ~/.bin/crave
          chmod +x ~/.bin/crave
          sudo ln -sf $HOME/.bin/crave /usr/bin/crave
          crave --version || true
          # create crave.conf from sample (crave expects ~/crave.conf or ~/.crave.conf)
          if [ -f crave.conf.sample ]; then
            envsubst < crave.conf.sample > /tmp/crave.conf
            mkdir -p $HOME
            cp -v /tmp/crave.conf $HOME/crave.conf
            cp -v /tmp/crave.conf $HOME/.crave.conf
            cat $HOME/.crave.conf | sed 's/token = .*/token = ***/' || true
            crave --version 2>&1 | head || true
          else
            echo "::warning::crave.conf.sample not found"
          fi
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Debug crave CLI
        run: |
          crave --help || true
          echo "=== crave list --help ==="
          crave list --help 2>&1 || true
          echo "=== crave devspace --help ==="
          crave devspace --help 2>&1 || true
          echo "=== crave run --help ==="
          crave run --help 2>&1 | head -n 100 || true
          echo "=== crave.conf ==="
          cat ~/.crave.conf | sed 's/"Authorization": ".*"/"Authorization": "***"/' || cat ~/crave.conf | sed 's/"Authorization": ".*"/"Authorization": "***"/' || true
          echo "=== crave list ==="
          crave list 2>&1 | head -n 100 || true
          crave list --json 2>&1 | head -n 200 || true

      - name: Configure crave.yaml
        run: |
          if [[ -n "${{ secrets.CUSTOM_YAML }}" ]]; then
            echo "${{ secrets.CUSTOM_YAML }}" > /tmp/crave.yaml
            echo "Using CUSTOM_YAML secret"
            cat /tmp/crave.yaml
          else
            cp configs/crave/crave.yaml.aosp /tmp/crave.yaml
            echo "Using configs/crave/crave.yaml.aosp"
            cat /tmp/crave.yaml
          fi
          # Prepare local crave.yaml for devspace (optional)
          echo "Prepared /tmp/crave.yaml"

      - name: Build via crave devspace (gtel3g)
        run: |
          set -e
          LOCAL_MANIFEST_URL="https://raw.githubusercontent.com/BytinIsDead/gtel3g-builder/main/manifests/gtel3g.xml"
          LUNCH="lunch lineage_gtel3g-${{ inputs.variant || 'userdebug' }}"
          BUILD_CMD="mka bacon -j\$(nproc --all)"

          echo "=== Building via crave devspace ==="
          echo "PROJECTFOLDER=$PROJECTFOLDER"
          echo "LUNCH=$LUNCH"

          # Use crave devspace to run build directly inside allocated devspace
          # This works with crave 0.2+ without needing 'crave run' queue
          crave devspace -- "
            set -e
            echo \"=== inside devspace ===\"
            pwd; ls -la
            # Ensure project folder exists and init if needed
            mkdir -p $PROJECTFOLDER
            cd $PROJECTFOLDER
            echo \"PWD=\$(pwd)\"

            if [ ! -d .repo ]; then
              echo \"=== repo init Lineage16 ===\"
              $REPO_INIT
            else
              echo \"=== .repo exists, skipping init ===\"
            fi

            echo \"=== local manifest ===\"
            mkdir -p .repo/local_manifests
            rm -rf .repo/local_manifests/*.xml || true
            curl -L $LOCAL_MANIFEST_URL -o .repo/local_manifests/gtel3g.xml
            cat .repo/local_manifests/gtel3g.xml

            echo \"=== repo sync ===\"
            if [ -f /opt/crave/resync.sh ]; then
              /opt/crave/resync.sh
            elif [ -f /usr/bin/resync ]; then
              /usr/bin/resync
            else
              repo sync -c -j\$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch
            fi

            export BUILD_USERNAME=${{ github.actor }}
            export BUILD_HOSTNAME=crave
            source build/envsetup.sh
            $LUNCH
            # Optional clean
            if [[ \"${{ inputs.clean }}\" == \"yes\" ]]; then
              make installclean
            fi
            $BUILD_CMD
          "
          echo "=== crave devspace build finished ==="

      - name: Pull artifacts from crave
        if: always()
        run: |
          set +e
          echo "=== pulling via crave devspace ==="
          # List via devspace
          crave devspace -- "ls -lh $PROJECTFOLDER/out/target/product/gtel3g/ 2>&1 | head -n 50; du -sh $PROJECTFOLDER/out/target/product/gtel3g/* 2>/dev/null | head -n 20 || true" || crave exec -- "ls -lh $PROJECTFOLDER/out/target/product/gtel3g/" 2>&1 | head -n 50 || true

          mkdir -p $GITHUB_WORKSPACE/pulled
          # Try crave pull (works for devspace files)
          for f in $PROJECTFOLDER/out/target/product/gtel3g/*.zip $PROJECTFOLDER/out/target/product/gtel3g/*.zip.md5sum $PROJECTFOLDER/out/target/product/gtel3g/recovery.img $PROJECTFOLDER/out/error.log; do
            echo "Trying pull $f"
            crave pull "$f" 2>&1 | head -n 20 || true
            # crave pull may place file in cwd with basename
            if [ -f "$(basename $f)" ]; then mv -v "$(basename $f)" $GITHUB_WORKSPACE/pulled/ 2>/dev/null || true; fi
          done
          # Also try devspace cp via tar
          crave devspace -- "tar -czf /tmp/gtel3g-pulled.tar.gz -C $PROJECTFOLDER out/target/product/gtel3g/*.zip out/target/product/gtel3g/*.zip.md5sum out/error.log 2>&1 | head -n 20; ls -lh /tmp/gtel3g-pulled.tar.gz || true" || true
          crave pull /tmp/gtel3g-pulled.tar.gz 2>&1 | head -n 20 || true
          if [ -f gtel3g-pulled.tar.gz ]; then mv gtel3g-pulled.tar.gz $GITHUB_WORKSPACE/pulled/ || true; tar -xzf $GITHUB_WORKSPACE/pulled/gtel3g-pulled.tar.gz -C $GITHUB_WORKSPACE/pulled/ 2>&1 | head -n 20 || true; fi
          if [ -f /tmp/gtel3g-pulled.tar.gz ]; then cp /tmp/gtel3g-pulled.tar.gz $GITHUB_WORKSPACE/pulled/ 2>/dev/null || true; fi

          echo "=== pulled ==="
          ls -lh $GITHUB_WORKSPACE/pulled/ || true
          cat $GITHUB_WORKSPACE/pulled/out/error.log 2>&1 | head -n 200 || true
          cat $PROJECTFOLDER/out/error.log 2>&1 | head -n 200 || true

      - name: Upload artifacts to GitHub (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtel3g-crave-${{ github.run_number }}
          path: |
            pulled/*
            out/error.log
            out/target/product/gtel3g/*.zip
            out/target/product/gtel3g/*.zip.md5sum
          if-no-files-found: warn
          retention-days: 14

      - name: Release
        if: always() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crave-${{ github.run_number }}
          name: gtel3g crave build ${{ github.run_number }}
          body: |
            Crave build `${{ github.run_number }}` — Lineage 16.0 `gtel3g`

            - Device: `BytinIsDead/android_device_samsung_gtel3g@lineage-16.0`
            - Kernel: `BytinIsDead/android_kernel_samsung_gtel3g@main`
            - Base: `Lineage16` (accupara/los16, projectID 81)
            - Manifest: `manifests/gtel3g.xml`
            - Variant: `${{ inputs.variant }}` clean: `${{ inputs.clean }}`
          files: |
            pulled/*.zip
            pulled/*.zip.md5sum
            out/target/product/gtel3g/*.zip
          fail_on_unmatched_files: false

      - name: Destroy clone (optional)
        if: always()
        run: |
          # Keep clone for ccache reuse; only destroy if you want clean next time
          echo "Clone kept at $PROJECTFOLDER for next build (reuse ccache). Destroy manually with: crave clone destroy -y $PROJECTFOLDER"
          # Uncomment to auto-destroy:
          # crave clone destroy -y "$PROJECTFOLDER" || true
